name: daily-crawl

on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}   # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler deps
        run: |
          pip install -r crawler/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Crawl
        run: python crawler/main.py

      - name: Commit data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F) 수집"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deploy
        uses: actions/deploy-pages@v4
      
